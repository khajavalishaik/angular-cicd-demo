name: Angular CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npx --yes --package npm@11 -- npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build Angular app
        run: npm run build